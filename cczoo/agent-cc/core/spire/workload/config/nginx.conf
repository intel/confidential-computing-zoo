user argus-nginx;
worker_processes 1;
pid @NGINX_RUN@/nginx.pid;
error_log stderr info;
worker_shutdown_timeout 5s;
events { worker_connections 256; }
http {
    access_log @NGINX_RUN@/access.log;
    client_body_temp_path @NGINX_RUN@/client_temp;
    proxy_temp_path @NGINX_RUN@/proxy_temp;
    fastcgi_temp_path @NGINX_RUN@/fastcgi_temp;
    uwsgi_temp_path @NGINX_RUN@/uwsgi_temp;
    scgi_temp_path @NGINX_RUN@/scgi_temp;
    server {
        listen @TLS_PORT@ ssl;
        ssl_certificate @CREDENTIALS@/current/svid.pem;
        ssl_certificate_key @CREDENTIALS@/current/key.pem;
        ssl_client_certificate @CREDENTIALS@/current/bundle.pem;
        # TLS verifies the client chain; the local auth_request below separately
        # requires an exact allowed SPIFFE ID from that verified leaf.
        ssl_verify_client on;
        ssl_verify_depth 5;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Disable resumption so new handshakes exchange and validate certificates.
        ssl_session_cache off;
        ssl_session_tickets off;
        ssl_early_data off;
        keepalive_timeout 5s;
        location = /_argus_authz {
            internal;
            proxy_pass http://unix:@AUTHZ_SOCKET@:/authorize;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # Replace any caller-supplied values with TLS connection metadata.
            proxy_set_header X-Argus-TLS-Cert $ssl_client_escaped_cert;
            proxy_set_header X-Argus-TLS-Verified $ssl_client_verify;
        }
        location / {
            auth_request /_argus_authz;
            proxy_pass http://127.0.0.1:@LISTEN_PORT@;
            # Do not expose internal authorization assertions to the application.
            proxy_set_header X-Argus-TLS-Cert "";
            proxy_set_header X-Argus-TLS-Verified "";
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
