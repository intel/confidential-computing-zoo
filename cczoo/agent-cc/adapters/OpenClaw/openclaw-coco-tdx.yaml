apiVersion: v1
kind: Pod
metadata:
  name: openclaw-coco-tdx-gateway
  namespace: default
  labels:
    app: openclaw-coco-tdx
spec:
  runtimeClassName: kata-qemu-tdx-linux
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: openclaw
      image: docker.io/library/openclaw-coco-smoke:patched
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      env:
        - name: HOME
          value: /dev/shm/openclaw-state
        - name: OPENCLAW_STATE_DIR
          value: /dev/shm/openclaw-state
        - name: OPENCLAW_CONFIG_PATH
          value: /dev/shm/openclaw-state/openclaw.json
        - name: XDG_CACHE_HOME
          value: /dev/shm/openclaw-cache
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-api-key
              key: OPENAI_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-api-key
              key: OPENAI_API_KEY
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-gateway-token
              key: OPENCLAW_GATEWAY_TOKEN
        # Set these proxy values when the guest requires outbound proxy access.
        # The deployment script populates them from OPENCLAW_PROXY_URL.
        # - name: HTTPS_PROXY
        #   value: http://proxy.example:8080
        # - name: HTTP_PROXY
        #   value: http://proxy.example:8080
        # - name: NO_PROXY
        #   value: 127.0.0.1,localhost
      command: ["sh", "-eu", "-c"]
      args:
        - >-
          mkdir -p /dev/shm/openclaw-state /dev/shm/openclaw-cache;
          node /app/dist/index.js config set gateway.mode local;
          node /app/dist/index.js config set gateway.bind loopback;
          node /app/dist/index.js config set gateway.auth.mode token;
          node /app/dist/index.js config set agents.defaults.sandbox.mode off;
          node /app/dist/index.js config set plugins.entries.perplexity.enabled false --strict-json;
          node /app/dist/index.js config set agents.defaults.model openrouter/nvidia/nemotron-3.5-lightning:free;
          node /app/dist/index.js config set "agents.defaults.models[\"openrouter/nvidia/nemotron-3.5-lightning:free\"].params.maxTokens" 4096 --strict-json;
          exec node /app/dist/index.js gateway run --bind loopback --auth token --port 18789
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      readinessProbe:
        exec:
          command:
            - node
            - -e
            - >-
              const token = process.env.OPENCLAW_GATEWAY_TOKEN || '';
              const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
              fetch('http://127.0.0.1:18789/health', { headers })
                .then(r => process.exit(r.ok ? 0 : 1))
                .catch(() => {
                  fetch('http://127.0.0.1:18789/healthz', { headers })
                    .then(r => process.exit(r.ok ? 0 : 1))
                    .catch(() => process.exit(1));
                });
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 12
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
