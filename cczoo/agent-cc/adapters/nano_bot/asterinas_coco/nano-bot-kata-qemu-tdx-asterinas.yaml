apiVersion: v1
kind: Pod
metadata:
  name: nano-bot-kata-qemu-tdx-asterinas
  labels:
    app: nano-bot
spec:
  runtimeClassName: kata-qemu-tdx-asterinas
  restartPolicy: Never
  containers:
    - name: nano-bot
      image: docker.io/library/nano_bot:2.0
      imagePullPolicy: Always
      command: ["sleep", "infinity"]
      env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: nano-bot-api-key
              key: OPENAI_API_KEY
        - name: OPENAI_API_ADDRESS
          value: "https://aidemo.intel.cn/v1"
        - name: NANO_BOT_MODEL
          value: "minimax-m2.7"
        - name: FARADAY_SSL_VERIFY
          value: "none"
        - name: NO_PROXY
          value: "127.0.0.1,localhost,10.244.0.0/16,10.96.0.0/12"
        - name: no_proxy
          value: "127.0.0.1,localhost,10.244.0.0/16,10.96.0.0/12"